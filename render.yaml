services:
  # ── FastAPI ML microservice (sales forecasting + customer segmentation) ──
  - type: web
    name: shopify-ml-service
    runtime: python
    rootDir: ml_service
    plan: free
    buildCommand: pip install -r requirements.txt && python train_models.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Node/Express backend that also serves the built React frontend ──
  - type: web
    name: shopify-app
    runtime: node
    rootDir: .
    plan: free
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      # Auto-wired to the ML service host (scheme is added by the server).
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: shopify-ml-service
          property: host
      - key: SCOPES
        value: read_products,read_orders,write_orders
      # Secrets — set these in the Render dashboard (sync: false).
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
